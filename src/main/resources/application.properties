spring.application.name=MatchX
binance.api.websocket=wss://stream.binance.com:9443/ws/btcusdt@trade

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:matchx}
spring.datasource.username=${DB_USER:matchx}
spring.datasource.password=${DB_PASSWORD:matchx}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Локальная БД уже содержит схему от прежнего ddl-auto=update. baseline-on-migrate помечает
# её как версию 1, поэтому V1 на ней пропускается. На пустой БД baseline не применяется
# и V1 выполняется обычным образом.
# Можно убрать после пересоздания volume: docker compose -f docker-compose.dev.yml down -v
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
