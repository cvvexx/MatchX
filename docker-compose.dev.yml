services:
  postgres:
    image: postgres:17-alpine
    container_name: matchx-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: matchx
      POSTGRES_USER: matchx
      POSTGRES_PASSWORD: matchx
    ports:
      - "5432:5432"
    volumes:
      - matchx-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matchx -d matchx"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  matchx-postgres-data:
